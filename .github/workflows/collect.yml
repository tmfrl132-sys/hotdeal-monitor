name: collect
on:
  schedule:
    # 정각·30분은 GitHub 부하가 몰려 실행이 자주 밀리거나 빠져서 피한다
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 테스트
        run: python -m pytest -q
      - name: deals.json 만들기
        # 이전 deals.json을 이어받는다 (처음에는 없어서 새로 시작).
        # FM코리아는 GitHub 서버 IP를 HTTP 430으로 막아서 뺀다 (PC 상주 실행에서는 된다).
        run: >-
          python -m monitor.publish --out site/deals.json
          --prev-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deals.json"
          --skip fmkorea:hotdeal
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
