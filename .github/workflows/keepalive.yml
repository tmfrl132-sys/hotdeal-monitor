name: keepalive
# 공개 저장소는 60일 동안 커밋이 없으면 GitHub가 예약 실행(collect.yml)을 끈다.
# 매달 1일 빈 커밋을 남겨 수집이 멈추지 않게 한다.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: 예약 실행 유지용 빈 커밋"
          git push
