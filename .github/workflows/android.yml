name: android
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "릴리스할 버전 (예: v0.5.0). 비우면 테스트와 디버그 빌드만 한다"
        required: false
        default: ""
permissions:
  contents: write
env:
  # 릴리스 버전: 태그(v*)를 push했으면 그 태그, 수동 실행에서 버전을 넣었으면 그 값. 둘 다 아니면 빈 값.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 릴리스 버전 확인
        if: env.RELEASE_TAG != '' && !startsWith(github.ref, 'refs/tags/v')
        # 수동 릴리스는 main에서만, v0.0.0 형식만, 이미 있는 버전은 덮어쓰지 않는다
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::수동 릴리스는 main 브랜치에서만 실행할 수 있습니다 (지금: $GITHUB_REF_NAME)"; exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전은 v0.5.0 형식이어야 합니다 (입력: $RELEASE_TAG)"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null; then
            echo "::error::$RELEASE_TAG 태그가 이미 있습니다. 다른 버전을 넣어 주세요"; exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: 단위 테스트
        run: gradle -p android testDebugUnitTest
      - name: 디버그 빌드
        if: env.RELEASE_TAG == ''
        run: gradle -p android assembleDebug

      # 태그(v*)를 push하거나 수동 실행에서 버전을 넣으면 서명된 APK를 Releases에 올린다
      - name: 서명 키 풀기
        if: env.RELEASE_TAG != ''
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hotdeal.p12"
      - name: 서명된 릴리스 빌드
        if: env.RELEASE_TAG != ''
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/hotdeal.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_NAME: ${{ env.RELEASE_TAG }}
        run: |
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "hotdeal-monitor-${RELEASE_TAG}.apk"
      # 수동 실행이면 태그가 없으므로 지금 빌드한 커밋에 태그를 새로 만든다
      - name: Release에 올리기
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: hotdeal-monitor-${{ env.RELEASE_TAG }}.apk
